<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #1f2937; background: #f9fafb; }
        header { background: #111827; color: white; padding: 1rem 1.5rem; }
        nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; max-width: 960px; margin: 0 auto; }
        nav a, nav button { color: white; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
        nav a:hover, nav button:hover { text-decoration: underline; }
        main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 0.75rem; }
        .errorlist { color: #b91c1c; margin: 0.25rem 0 0.75rem; }
        label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
        input[type="text"], input[type="password"], input[type="date"], textarea { width: 100%; max-width: 36rem; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; box-sizing: border-box; }
        .actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.75rem; }
        .button, button { background: #2563eb; color: white; border: 0; border-radius: 0.375rem; padding: 0.55rem 0.8rem; text-decoration: none; cursor: pointer; font: inherit; }
        .button.secondary, button.secondary { background: #6b7280; }
        .button.danger, button.danger { background: #dc2626; }
        .muted { color: #6b7280; }
        .status { font-weight: 700; }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="{% url 'home' %}"><strong>Task Manager</strong></a>
        <div class="actions">
            {% if user.is_authenticated %}
                <a href="{% url 'task_list' %}">Tasks</a>
                <span>{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>
</header>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
